server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
  }
  location /storage/ {
    proxy_pass http://backend:8080/storage/;
  }
  location /ai/ {
    proxy_pass http://ai-service:8000/;
  }
  location / {
    try_files $uri /index.html;
  }
}

